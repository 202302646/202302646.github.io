<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hi, I'm Jannah!</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #E8E3EE;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .card {
            background: #ffffff;
            padding: 50px 40px;
            border-radius: 24px;
            text-align: center;
            max-width: 550px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        h1 {
            font-size: 2.5rem;
            color: #2B2B2B;
            margin: 0 0 8px 0;
            font-weight: 700;
        }
        .subtitle {
            color: #8E8E93;
            font-size: 1.15rem;
            margin-bottom: 25px;
        }
        hr {
            border: none;
            border-top: 1px solid #E5E5EA;
            margin: 25px 0;
        }
        .description {
            color: #4A4A4A;
            font-size: 1rem;
            line-height: 1.6;
            margin: 0;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Hi, I'm Jannah! ♡</h1>
        <div class="subtitle">Bachelor of Science in Information Technology</div>
        <hr>
        <p class="description">
            An Information Technology student and UI/web designer building simple, beautiful digital experiences.
        </p>
    </div>

</body>
</html>
